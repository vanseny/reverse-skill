server {
    listen 80;
    server_name _;

    root /srv;
    autoindex off;

    # Smart HTTP git backend.
    # The Claude plugin loader clones with `git clone --depth 1`, and dumb HTTP
    # rejects that ("dumb http transport does not support shallow capabilities"),
    # so a bare static file serve is not enough — git-http-backend must answer
    # info/refs for the shallow/upload-pack negotiation.
    location ~ ^/(?<repo>.+\.git)/(?<gitpath>.*)$ {
        include fastcgi_params;

        fastcgi_pass unix:/run/fcgiwrap.sock;

        fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
        fastcgi_param GIT_PROJECT_ROOT    /srv;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
        fastcgi_param PATH_INFO           /$repo/$gitpath;
        fastcgi_param REMOTE_USER         $remote_user;

        # git objects are already compressed; letting nginx re-compress breaks
        # pack negotiation for some clients.
        gzip off;
    }

    # Liveness probe for operators.
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # marketplace.json and any future static assets.
    location / {
        try_files $uri $uri/ =404;
    }
}
